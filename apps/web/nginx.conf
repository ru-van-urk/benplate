# Behind Traefik (Dokploy), TLS ends at the proxy: keep its X-Forwarded-Proto, fall back to our own scheme.
# A map must sit at http level; conf.d/default.conf is included inside http, so the top of this file works
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Resolve the server at request time via Docker DNS, so nginx starts even while it is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $server http://server:3000;

    include /etc/nginx/snippets/headers.conf;

    # Same-origin API: the browser never talks to the server directly, so no CORS or public server URL
    location ~ ^/api(/|$) {
        proxy_pass $server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Hashed file names, so they never change
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidated, so a deploy never leaves a cached index.html pointing at removed chunks
    location = /index.html {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
