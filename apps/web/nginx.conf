server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Resolve the server at request time via Docker DNS, so nginx starts even while it is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $server http://server:3000;

    # Same-origin API: the browser never talks to the server directly, so no CORS or public server URL
    location ~ ^/api(/|$) {
        proxy_pass $server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
