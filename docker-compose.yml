name: maribor
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}

    depends_on:
      server:
        condition: service_healthy

    ports:
      - "3000:80"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile

    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-file:/data/local.db}

    ports:
      - "3001:3001"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

    volumes:
      - data:/data

volumes:
  data:
