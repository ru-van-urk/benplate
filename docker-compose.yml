services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile

    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/local.db}

    expose:
      - "3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

    volumes:
      - data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    depends_on:
      server:
        condition: service_healthy

    expose:
      - "80"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:80/
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

volumes:
  data:
