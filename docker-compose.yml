services:
  db:
    image: postgres:18

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, see .env.example}
      POSTGRES_DB: benplate

    healthcheck:
      test:
        - CMD
        # TCP, not the socket: on first boot the init server listens on the socket only
        - pg_isready
        - -h
        - 127.0.0.1
        - -U
        - postgres
        - -d
        - benplate
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql

  # One-off: applies pending migrations from the server image, then exits; the server waits for it to succeed
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile

    command:
      - node
      - dist/migrate.mjs

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, see .env.example}@db:5432/benplate}

    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile

    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, see .env.example}@db:5432/benplate}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    # No depends_on: nginx resolves `server` per request, so the SPA stays up while the API is down
    expose:
      - "80"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:80/
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

volumes:
  postgres_data:
