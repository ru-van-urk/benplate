services:
  db:
    image: postgres:18

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, see .env.example}
      POSTGRES_DB: maribor

    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
        - -d
        - maribor
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql

  # One-off: syncs the schema with `drizzle-kit push`, then exits; the server waits for it to succeed
  drizzle:
    build:
      context: .
      dockerfile: packages/db/Dockerfile

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL, see .env.example}

    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile

    depends_on:
      drizzle:
        condition: service_completed_successfully

    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL, see .env.example}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    depends_on:
      server:
        condition: service_healthy

    expose:
      - "80"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:80/
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

volumes:
  postgres_data:
